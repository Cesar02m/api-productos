services:
  db:
    image: postgres:16-alpine
    container_name: productos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-productos_db}
      POSTGRES_USER: ${DB_USER:-productos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y define DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: productos_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-productos_db}
      DB_USER: ${DB_USER:-productos_user}
      DB_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y define DB_PASSWORD}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
